# FIXTURE: over-privileged RBAC and exposed services for IaC scanning.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tigergate-fixture
  namespace: default
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tigergate-fixture-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tigergate-fixture-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: tigergate-fixture
    namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: tigergate-fixture-secret
type: Opaque
stringData:
  db-password: "Pr0dDbP4ssw0rd!"
---
apiVersion: v1
kind: Service
metadata:
  name: tigergate-fixture-public
spec:
  type: NodePort
  selector: { app: tigergate-test-swift }
  ports:
    - port: 22
      nodePort: 30022
