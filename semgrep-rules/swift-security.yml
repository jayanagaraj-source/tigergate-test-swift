# Custom Swift SAST rules for TigerGate.
# The default rulesets (p/default, p/owasp-top-ten, p/security-audit) have almost no
# Swift coverage, so these rules fill the gap. Loaded via sast.custom_rules_dir in .tigergate.yml.
rules:
  # ---------------------------------------------------------------- Injection
  - id: swift-sqlite-injection
    languages: [swift]
    severity: ERROR
    message: SQL built from interpolated or concatenated input reaches SQLite. Use sqlite3_bind_* with a prepared statement.
    metadata: { cwe: "CWE-89: SQL Injection", owasp: "A03:2021 - Injection", category: security, confidence: MEDIUM }
    mode: taint
    pattern-sources:
      - pattern: '"...\(...)..."'
      - pattern: '"..." + $X'
      - pattern: '$X + "..."'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: sqlite3_exec($DB, $SQL, ...)
              - pattern: sqlite3_prepare_v2($DB, $SQL, ...)
              - pattern: sqlite3_prepare($DB, $SQL, ...)
          - focus-metavariable: $SQL

  - id: swift-os-command-injection
    languages: [swift]
    severity: ERROR
    message: Shell command built from dynamic input. Pass arguments as a list to a fixed executable without a shell.
    metadata: { cwe: "CWE-78: OS Command Injection", owasp: "A03:2021 - Injection", category: security, confidence: HIGH }
    pattern-either:
      - pattern: '$T.arguments = ["-c", "...\(...)..."]'
      - pattern: '$T.arguments = ["-c", "..." + $X]'
      - pattern: 'system("...\(...)...")'
      - pattern: 'system("..." + $X)'
      - pattern: 'popen("...\(...)...", $M)'
      - pattern: 'popen("..." + $X, $M)'

  - id: swift-path-traversal
    languages: [swift]
    severity: ERROR
    message: File path built from untrusted input reaches a file operation. Canonicalise and confine it to the base directory.
    metadata: { cwe: "CWE-22: Path Traversal", owasp: "A01:2021 - Broken Access Control", category: security, confidence: MEDIUM }
    mode: taint
    pattern-sources:
      - pattern: '"..." + $X'
      - pattern: '"...\(...)..."'
      - pattern: $BASE.appendingPathComponent($X)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'String(contentsOfFile: $P, ...)'
              - pattern: 'Data(contentsOf: $P, ...)'
              - pattern: 'FileManager.default.removeItem(at: $P)'
              - pattern: 'FileManager.default.removeItem(atPath: $P)'
              - pattern: 'FileManager.default.contents(atPath: $P)'
          - focus-metavariable: $P

  - id: swift-format-string
    languages: [swift]
    severity: WARNING
    message: Non-literal format string. An attacker-controlled format can read or corrupt memory.
    metadata: { cwe: "CWE-134: Use of Externally-Controlled Format String", category: security, confidence: MEDIUM }
    pattern-either:
      - patterns:
          - pattern: NSLog($FMT)
          - pattern-not: NSLog("...")
      - patterns:
          - pattern: 'String(format: $FMT)'
          - pattern-not: 'String(format: "...")'

  - id: swift-predicate-expression-injection
    languages: [swift]
    severity: ERROR
    message: NSPredicate/NSExpression format built from dynamic input can evaluate attacker-controlled expressions.
    metadata: { cwe: "CWE-917: Expression Language Injection", owasp: "A03:2021 - Injection", category: security, confidence: MEDIUM }
    pattern-either:
      - pattern: 'NSPredicate(format: "...\(...)...")'
      - pattern: 'NSPredicate(format: "..." + $X)'
      - patterns:
          - pattern: 'NSExpression(format: $FMT)'
          - pattern-not: 'NSExpression(format: "...")'

  - id: swift-webview-script-injection
    languages: [swift]
    severity: ERROR
    message: Dynamic content injected into a WKWebView as HTML or JavaScript enables XSS / script injection.
    metadata: { cwe: "CWE-79: Cross-site Scripting", owasp: "A03:2021 - Injection", category: security, confidence: MEDIUM }
    mode: taint
    pattern-sources:
      - pattern: '"...\(...)..."'
      - pattern: '"..." + $X'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $W.loadHTMLString($H, ...)
              - pattern: $W.evaluateJavaScript($H, ...)
          - focus-metavariable: $H

  - id: swift-webview-file-access
    languages: [swift]
    severity: WARNING
    message: WebView allows file:// pages to access other files or origins.
    metadata: { cwe: "CWE-749: Exposed Dangerous Method or Function", category: security, confidence: HIGH }
    pattern-either:
      - pattern: '$C.setValue(true, forKey: "allowFileAccessFromFileURLs")'
      - pattern: '$C.setValue(true, forKey: "allowUniversalAccessFromFileURLs")'

  # ---------------------------------------------------------------- Cryptography
  - id: swift-weak-hash
    languages: [swift]
    severity: WARNING
    message: MD5/SHA-1 are broken for security use. Use SHA-256+ (or a password KDF for passwords).
    metadata: { cwe: "CWE-328: Use of Weak Hash", owasp: "A02:2021 - Cryptographic Failures", category: security, confidence: HIGH }
    pattern-either:
      - pattern: CC_MD5(...)
      - pattern: CC_SHA1(...)
      - pattern: Insecure.MD5.hash(...)
      - pattern: Insecure.SHA1.hash(...)

  - id: swift-weak-cipher
    languages: [swift]
    severity: ERROR
    message: DES/3DES/RC4 or ECB mode is insecure. Use AES-GCM (CryptoKit AES.GCM).
    metadata: { cwe: "CWE-327: Broken or Risky Cryptographic Algorithm", owasp: "A02:2021 - Cryptographic Failures", category: security, confidence: HIGH }
    pattern-either:
      - pattern: kCCAlgorithmDES
      - pattern: kCCAlgorithm3DES
      - pattern: kCCAlgorithmRC4
      - pattern: kCCOptionECBMode

  - id: swift-static-iv
    languages: [swift]
    severity: WARNING
    message: Constant IV. IVs must be random per encryption.
    metadata: { cwe: "CWE-329: Not Using a Random IV", owasp: "A02:2021 - Cryptographic Failures", category: security, confidence: MEDIUM }
    pattern: '[UInt8](repeating: 0, count: kCCBlockSizeAES128)'

  - id: swift-weak-pbkdf2-iterations
    languages: [swift]
    severity: WARNING
    message: PBKDF2 iteration count is far too low. Use at least 600,000 for PBKDF2-HMAC-SHA256.
    metadata: { cwe: "CWE-916: Insufficient Computational Effort", owasp: "A02:2021 - Cryptographic Failures", category: security, confidence: HIGH }
    patterns:
      - pattern: CCKeyDerivationPBKDF($A, $P, $PL, $S, $SL, $PRF, $ITER, ...)
      - metavariable-comparison:
          metavariable: $ITER
          comparison: $ITER < 100000

  - id: swift-insecure-random
    languages: [swift]
    severity: WARNING
    message: Non-cryptographic RNG. Use SecRandomCopyBytes or SystemRandomNumberGenerator-backed APIs for secrets.
    metadata: { cwe: "CWE-338: Use of Cryptographically Weak PRNG", owasp: "A02:2021 - Cryptographic Failures", category: security, confidence: MEDIUM }
    pattern-either:
      - pattern: rand()
      - pattern: random()
      - pattern: srand48(...)
      - pattern: arc4random()
      - pattern: arc4random_uniform(...)

  # ---------------------------------------------------------------- Transport
  - id: swift-tls-trust-all
    languages: [swift]
    severity: ERROR
    message: Server trust accepted without evaluation — TLS certificate validation is disabled.
    metadata: { cwe: "CWE-295: Improper Certificate Validation", owasp: "A07:2021 - Identification and Authentication Failures", category: security, confidence: HIGH }
    pattern-either:
      - pattern: '$H(.useCredential, URLCredential(trust: $T))'
      - pattern: $H(.useCredential, nil)

  - id: swift-cleartext-http-url
    languages: [swift]
    severity: WARNING
    message: Cleartext http:// URL. Use HTTPS.
    metadata: { cwe: "CWE-319: Cleartext Transmission of Sensitive Information", owasp: "A02:2021 - Cryptographic Failures", category: security, confidence: MEDIUM }
    patterns:
      - pattern: '"$URL"'
      - metavariable-regex:
          metavariable: $URL
          regex: ^http://(?!localhost|127\.0\.0\.1)

  - id: swift-untrusted-url
    languages: [swift]
    severity: WARNING
    message: URL constructed directly from an untrusted value — enables SSRF, open redirect, or loading attacker-chosen content. Validate against an allowlist of schemes and hosts.
    metadata: { cwe: "CWE-918: Server-Side Request Forgery / CWE-601: Open Redirect", owasp: "A10:2021 - Server-Side Request Forgery", category: security, confidence: LOW }
    patterns:
      - pattern: 'URL(string: $U)'
      - metavariable-regex:
          metavariable: $U
          regex: (?i)^(user\w*|untrusted\w*|input|next|target|redirect\w*|return\w*)$

  - id: swift-hardcoded-basic-auth
    languages: [swift]
    severity: ERROR
    message: Hardcoded user:password encoded into a Basic auth header.
    metadata: { cwe: "CWE-798: Hard-coded Credentials", owasp: "A07:2021 - Identification and Authentication Failures", category: security, confidence: HIGH }
    patterns:
      - pattern: 'Data("$CREDS".utf8).base64EncodedString()'
      - metavariable-regex:
          metavariable: $CREDS
          regex: ^[^:\s]+:.+$

  # ---------------------------------------------------------------- Storage & logging
  - id: swift-keychain-accessible-always
    languages: [swift]
    severity: WARNING
    message: Keychain item readable while the device is locked. Use kSecAttrAccessibleWhenUnlockedThisDeviceOnly.
    metadata: { cwe: "CWE-311: Missing Encryption of Sensitive Data", category: security, confidence: HIGH }
    pattern-either:
      - pattern: kSecAttrAccessibleAlways
      - pattern: kSecAttrAccessibleAlwaysThisDeviceOnly

  - id: swift-file-no-protection
    languages: [swift]
    severity: WARNING
    message: File written without Data Protection or with world-writable permissions.
    metadata: { cwe: "CWE-732: Incorrect Permission Assignment", category: security, confidence: HIGH }
    pattern-either:
      - pattern: FileProtectionType.none
      - pattern: '0o777'

  - id: swift-sensitive-logging
    languages: [swift]
    severity: WARNING
    message: Sensitive value written to logs.
    metadata: { cwe: "CWE-532: Insertion of Sensitive Information into Log File", owasp: "A09:2021 - Security Logging and Monitoring Failures", category: security, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: NSLog($FMT, ..., $V, ...)
          - pattern: print("...\($V)...")
          - pattern: os_log($FMT, ..., $V)
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(password|passwd|secret|token|card).*

  - id: swift-hardcoded-secret-constant
    languages: [swift]
    severity: ERROR
    message: Hardcoded credential assigned to a secret-looking constant.
    metadata: { cwe: "CWE-798: Hard-coded Credentials", owasp: "A07:2021 - Identification and Authentication Failures", category: security, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: 'let $NAME = "$VALUE"'
          - pattern: 'static let $NAME = "$VALUE"'
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|passwd|secret|apikey|api_key|signingkey|privatekey|hardcodedkey).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{8,}

  - id: swift-predictable-temp-file
    languages: [swift]
    severity: WARNING
    message: Fixed, predictable path in /tmp is vulnerable to symlink and race attacks.
    metadata: { cwe: "CWE-377: Insecure Temporary File", category: security, confidence: HIGH }
    patterns:
      - pattern: '$S.write(toFile: "$PATH", ...)'
      - metavariable-regex:
          metavariable: $PATH
          regex: ^/tmp/

  # ---------------------------------------------------------------- Deserialization / XML
  - id: swift-insecure-deserialization
    languages: [swift]
    severity: ERROR
    message: NSKeyedUnarchiver without secure coding can instantiate arbitrary classes from untrusted data.
    metadata: { cwe: "CWE-502: Deserialization of Untrusted Data", owasp: "A08:2021 - Software and Data Integrity Failures", category: security, confidence: HIGH }
    pattern-either:
      - pattern: 'NSKeyedUnarchiver.unarchiveObject(with: ...)'
      - pattern: 'NSKeyedUnarchiver.unarchiveObject(withFile: ...)'
      - pattern: $U.requiresSecureCoding = false

  - id: swift-xxe
    languages: [swift]
    severity: ERROR
    message: XMLParser resolves external entities (XXE).
    metadata: { cwe: "CWE-611: Improper Restriction of XML External Entity Reference", owasp: "A05:2021 - Security Misconfiguration", category: security, confidence: HIGH }
    pattern: $P.shouldResolveExternalEntities = true

  - id: swift-redos-nested-quantifier
    languages: [swift]
    severity: WARNING
    message: Regex with nested quantifiers can backtrack catastrophically on crafted input.
    metadata: { cwe: "CWE-1333: Inefficient Regular Expression Complexity", category: security, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: 'NSRegularExpression(pattern: "$RE")'
          - pattern: 'NSRegularExpression(pattern: "$RE", options: $O)'
      - metavariable-regex:
          metavariable: $RE
          regex: .*\([^()]*[*+]\)[*+]

  # ---------------------------------------------------------------- Auth
  - id: swift-jwt-decoded-without-verification
    languages: [swift]
    severity: ERROR
    message: JWT payload decoded by splitting on "." with no signature verification. Verify with a JWT library before trusting claims.
    metadata: { cwe: "CWE-347: Improper Verification of Cryptographic Signature", owasp: "A07:2021 - Identification and Authentication Failures", category: security, confidence: MEDIUM }
    patterns:
      - pattern: '$JWT.split(separator: ".")'
      - metavariable-regex:
          metavariable: $JWT
          regex: (?i).*(jwt|token|bearer).*

  - id: swift-non-constant-time-secret-compare
    languages: [swift]
    severity: WARNING
    message: Secret compared with == leaks timing information. Use a constant-time comparison.
    metadata: { cwe: "CWE-208: Observable Timing Discrepancy", category: security, confidence: LOW }
    patterns:
      - pattern: $A == $B
      - metavariable-regex:
          metavariable: $A
          regex: (?i)^(token|pass|password|secret|signature|hmac)$

  - id: swift-biometric-auth-not-keychain-bound
    languages: [swift]
    severity: WARNING
    message: LAContext.evaluatePolicy result gates access without binding to a Keychain item (SecAccessControl); trivially bypassable on jailbroken devices.
    metadata: { cwe: "CWE-287: Improper Authentication", owasp: "M3: Insecure Authentication", category: security, confidence: LOW }
    pattern: '$CTX.evaluatePolicy($POLICY, localizedReason: $R) { $OK, $ERR in ... }'

  # ---------------------------------------------------------------- Config files
  - id: ios-ats-arbitrary-loads
    languages: [generic]
    paths: { include: ["*.plist"] }
    severity: ERROR
    message: App Transport Security disabled (NSAllowsArbitraryLoads / insecure HTTP exception).
    metadata: { cwe: "CWE-319: Cleartext Transmission of Sensitive Information", owasp: "M5: Insecure Communication", category: security, confidence: HIGH }
    pattern-either:
      - pattern: "<key>NSAllowsArbitraryLoads</key> <true/>"
      - pattern: "<key>NSAllowsArbitraryLoadsInWebContent</key> <true/>"
      - pattern: "<key>NSExceptionAllowsInsecureHTTPLoads</key> <true/>"
      - pattern: "<key>NSExceptionMinimumTLSVersion</key> <string>TLSv1.0</string>"
