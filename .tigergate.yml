# TigerGate CI/CD Configuration — generated by `tigergate-scanner init`, then adjusted
# for this deliberately-vulnerable fixture repo.
# Documentation: https://docs.tigergate.dev/ci-cd/config

region: us1

scan_types:
  - all

fail_on:
  - critical
  - high

# NOTE: the init default also excluded "test/". All fixtures live under src/ so nothing is hidden.
exclude_paths:
  - vendor/
  - node_modules/
  - .build/
  - Pods/
  - Carthage/Build/

sast:
  rules:
    - p/default
    - p/owasp-top-ten
    - p/security-audit
  # The default rulesets contain almost no Swift rules; this adds 28 Swift/iOS rules.
  custom_rules_dir: ./semgrep-rules

sca:
  ignore_unfixed: false

quality:
  max_complexity: 25
  max_function_lines: 100
  max_file_lines: 500

# This repo is SUPPOSED to fail the gate. A passing gate means a scanner stopped detecting.
quality_gate:
  max_critical: 0
  max_high: 10
  max_medium: -1
  max_low: -1
